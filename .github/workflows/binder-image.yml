name: binder-image

# Freezes this (archived) tool as a Docker image so it keeps launching on
# BinderHub regardless of upstream dependency drift.
#
#  1. Builds the image from environment.yml / requirements.txt with repo2docker
#     (the same builder BinderHub uses), at a pinned version.
#  2. Smoke-tests it: the Jupyter server starts and the notebook(s) execute.
#  3. Pushes it to Docker Hub.
#  4. Commits binder/Dockerfile pointing at the pushed image digest, so BinderHub
#     pulls the frozen image instead of re-solving the environment.
#
# Needs repo (or org) secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: [main, freeze]
    paths-ignore:
      - "binder/**"
      - "README.md"
      - "lite/**"
      - ".github/workflows/deploy-jupyterlite.yml"

permissions:
  contents: write

concurrency:
  group: binder-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: milysun/atap-${{ github.event.repository.name }}
  REPO2DOCKER_VERSION: "2026.04.0"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build from the environment spec, not from a previous binder/ pointer
        run: rm -rf binder

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image with repo2docker
        run: |
          pip install -q "jupyter-repo2docker==${REPO2DOCKER_VERSION}"
          TAG="${GITHUB_SHA::12}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          repo2docker --no-run --user-id 1000 --user-name jovyan \
            --image-name "${IMAGE}:${TAG}" .
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
          docker images "${IMAGE}"

      - name: Smoke test - server starts the way BinderHub starts it
        # BinderHub launches jupyterhub-singleuser and waits for /user/<name>/api,
        # so do the same (with dummy hub settings) rather than plain `jupyter lab`.
        run: |
          docker run -d --name smoke -p 8888:8888 \
            -e JUPYTERHUB_API_TOKEN=smoke -e JUPYTERHUB_CLIENT_ID=jupyterhub-user-smoke \
            -e JUPYTERHUB_API_URL=http://127.0.0.1:8081/hub/api -e JUPYTERHUB_USER=smoke \
            -e JUPYTERHUB_SERVICE_PREFIX=/user/smoke/ -e JUPYTERHUB_BASE_URL=/ \
            -e JUPYTERHUB_OAUTH_CALLBACK_URL=/user/smoke/oauth_callback \
            "${IMAGE}:${TAG}" jupyterhub-singleuser --ip=0.0.0.0 --port=8888
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8888/user/smoke/api && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8888/user/smoke/api; then
            docker logs smoke; exit 1
          fi
          echo
          docker exec smoke jupyter labextension list
          docker rm -f smoke

      - name: Smoke test - notebooks execute
        run: |
          docker run --rm -v "$PWD/.github/ci:/ci:ro" "${IMAGE}:${TAG}" \
            python /ci/smoke_test.py /ci/smoke_test.json

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Point Binder at the frozen image
        run: |
          git checkout -- . 2>/dev/null || true
          mkdir -p binder
          {
            echo "# Generated by .github/workflows/binder-image.yml - do not edit by hand."
            echo "# Frozen image of this tool, built from commit ${GITHUB_SHA}."
            echo "# BinderHub uses this file instead of environment.yml / requirements.txt."
            echo "FROM ${IMAGE}:${TAG}@${DIGEST#*@}"
          } > binder/Dockerfile
          cat binder/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binder/Dockerfile
          git commit -m "Point Binder at frozen image ${IMAGE}:${TAG}"
          git push
